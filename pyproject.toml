[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ashleaf"
version = "0.1.0"
description = "Open-source virtual unwrapping research and validation tools for the Herculaneum scrolls"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
pixels = ["numpy>=1.26", "tifffile>=2024.1"]
benchmark = ["numpy>=1.26", "tifffile>=2024.1", "scipy>=1.13,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
